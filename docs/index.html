<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dopple Render</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="container" id="intro">
    <h1>_DoppleRender</h1>
    <p>Real or AI-generated? Put your eye to the test in 10 rounds.</p>
    <div class="mode-selector" role="group" aria-label="Game mode" aria-describedby="modeDescription">
      <button type="button" data-mode="soft" aria-pressed="true" onclick="selectMode('soft')">Soft</button>
      <button type="button" data-mode="advanced" aria-pressed="false" onclick="selectMode('advanced')">Advanced</button>
      <button type="button" data-mode="time-attack" aria-pressed="false" onclick="selectMode('time-attack')">Time Attack</button>
    </div>
    <p id="modeDescription" aria-live="polite">Two images. Click on the real photo. No time limit.</p>
    <button type="button" onclick="startGame()">Begin</button>
  </div>

  <div class="container hidden" id="game">
    <div class="round-header">
      <h2><span id="modeTitle">Soft</span> · Round <span id="pairIndex">1</span>/<span id="roundsTotal">10</span></h2>
      <div class="timer hidden" id="timer" role="timer" aria-label="Time remaining">
        <span id="timeRemaining">5.0</span>s
      </div>
    </div>
    <p id="question">Click on the real photo.</p>
    <div class="pair" id="softPair">
      <img id="img1" onclick="makeChoice(0)" alt="First image">
      <img id="img2" onclick="makeChoice(1)" alt="Second image">
    </div>
    <div class="single-image hidden" id="advancedPair">
      <img id="singleImg" alt="Image to identify">
    </div>
    <div class="answer-actions hidden" id="answerActions">
      <button type="button" onclick="makeAdvancedChoice('real')" disabled>REAL</button>
      <button type="button" onclick="makeAdvancedChoice('ai')" disabled>AI</button>
    </div>
    <p id="loadingMessage" role="status">Loading images...</p>
  </div>

  <div class="container hidden" id="result">
    <h2>Summary</h2>
    <p><span id="resultMode">Soft</span> score: <span id="score"></span>/<span id="resultTotal">10</span></p>
    <div class="result-actions">
      <button type="button" onclick="startGame()">Play again</button>
      <button type="button" onclick="showModeSelection()">Change mode</button>
    </div>
    <div id="recap"></div>
  </div>

  <script src="image_mapping.js"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
